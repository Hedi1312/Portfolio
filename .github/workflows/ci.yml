name: CI Verification

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  verify-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Sécurité : Bloquer les PR vers main si elles ne viennent pas de staging
      - name: Check Branch Flow
        if: github.base_ref == 'main' && github.head_ref != 'staging'
        run: |
          echo "ERREUR : Le workflow impose de passer par la branche 'staging' avant 'main'."
          exit 1

      - name: Prettier check
        run: npm run format:check

      - name: Lint check
        run: npm run lint

      - name: Build check
        run: doppler run -- npm run build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
